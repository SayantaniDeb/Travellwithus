services:
  - type: web
    name: travellwithus-api
    runtime: python
    branch: master
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 12
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
